services:
  db:
    image: mysql:8.0
    container_name: beautylink-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: beautylink
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - beautylink_mysql_data:/var/lib/mysql

volumes:
  beautylink_mysql_data: